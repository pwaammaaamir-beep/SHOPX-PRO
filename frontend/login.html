<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود مدیریت | SHOPX PRO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Tahoma, Arial, sans-serif;
    background: #080808;
    color: white;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: #151515;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255,0,0,.25);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

h1 span {
    color: #ff3030;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #222;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #ff3030;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #e50914;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff2020;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

#error {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 10px;
    background: #351111;
    color: #ff7777;
    text-align: center;
}

#success {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 10px;
    background: #103519;
    color: #70e080;
    text-align: center;
}

/* ===== MOBILE OPTIMIZATION ===== */
@media (max-width:650px){html,body{overflow-x:hidden}.header{height:auto;padding:10px 12px;flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.hero{margin:14px 12px;padding:25px 18px}.hero h1{font-size:24px}.hero p{font-size:14px}.hero button{width:100%}.container{padding:0 10px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-image{height:165px}.product-info{padding:10px}.product-name{font-size:12px}.price-row{flex-direction:column;align-items:stretch}.add-cart{width:100%}.drawer{width:92%}.product-detail{grid-template-columns:1fr}.detail-image img{height:260px}.modal-box{width:100%;max-height:94vh;padding:17px}.topbar{padding:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.form-grid{grid-template-columns:1fr}.products-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-buttons{grid-template-columns:1fr}.btn{width:100%}.modal-actions{flex-direction:column}.modal-actions button,.modal-actions select{width:100%}.login-box{width:100%;max-width:390px;padding:25px 18px}input,button{font-size:16px}}
</style>
</head>

<body>

<div class="login-box">

    <h1>
        SHOPX <span>PRO</span>
    </h1>

    <div class="subtitle">
        ورود به پنل مدیریت
    </div>

    <form id="loginForm">

        <label for="username">
            نام کاربری
        </label>

        <input
            id="username"
            type="text"
            placeholder="admin"
            autocomplete="username"
            required
        >

        <label for="password">
            رمز عبور
        </label>

        <input
            id="password"
            type="password"
            placeholder="رمز عبور"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">
            🔐 ورود به پنل
        </button>

    </form>

    <div id="error"></div>

    <div id="success">
        ورود موفق بود، در حال ورود...
    </div>

</div>

<script>

const form =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const button =
    document.getElementById("loginButton");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    errorBox.style.display = "none";
    successBox.style.display = "none";

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    if (!username || !password) {
        showError("نام کاربری و رمز عبور را وارد کنید.");
        return;
    }

    button.disabled = true;
    button.textContent = "در حال بررسی...";

    try {

        const response = await fetch(
            "/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data =
            await response.json();

        if (response.ok && data.success) {

            successBox.style.display = "block";

            setTimeout(function() {

               window.location.href = "/admin/panel";

            }, 700);

        } else {

            showError(
                data.message ||
                "نام کاربری یا رمز عبور اشتباه است."
            );

            button.disabled = false;
            button.textContent = "🔐 ورود به پنل";
        }

    } catch (error) {

        showError(
            "سرور در دسترس نیست. مطمئن شو server.js روشن است."
        );

        button.disabled = false;
        button.textContent = "🔐 ورود به پنل";
    }

});


function showError(message) {

    errorBox.textContent = message;
    errorBox.style.display = "block";

}

</script>

</body>
</html>
